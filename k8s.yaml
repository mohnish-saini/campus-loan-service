# Local Minikube configuration
# Passwords below are only for this assignment demo.
apiVersion: v1
kind: Namespace
metadata:
  name: campus-lending
---
apiVersion: v1
kind: Secret
metadata:
  name: loan-config
  namespace: campus-lending
type: Opaque
stringData:
  POSTGRES_DB: loans
  POSTGRES_USER: loans
  POSTGRES_PASSWORD: local-loan-password
  DATABASE_URL: postgresql+psycopg://loans:local-loan-password@loan-db/loans
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loan-data
  namespace: campus-lending
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loan-db
  namespace: campus-lending
spec:
  selector:
    app: loan-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-db
  namespace: campus-lending
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loan-db
  template:
    metadata:
      labels:
        app: loan-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom:
        - secretRef:
            name: loan-config
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U loans -d loans
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: loan-data
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: campus-lending
spec:
  selector:
    app: loan-service
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: campus-lending
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-service
  template:
    metadata:
      labels:
        app: loan-service
    spec:
      containers:
      - name: loan
        image: campus-loan:1.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: loan-config
        env:
        - name: EQUIPMENT_SERVICE_URL
          value: http://equipment-service:8000
        ports:
        - containerPort: 8000
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loan-service
  namespace: campus-lending
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loan-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
